name: Release

# Publish the @johnhenry/oat-* packages from main with Changesets (fleet publish model:
# main is the release branch, see johnhenry/workflows' README). examples/file-transfer
# is private and never published.
#
# On every push to main this workflow either (a) opens/updates the "chore: version
# packages" PR that applies pending changesets, or (b) when that PR has just been
# merged, runs `npm run release` (scripts/staggered-publish.sh: dependency-ordered,
# staggered, skips versions already on npm) and, as a by-product, changesets/action
# pushes a tag + creates a GitHub Release per published package (the script emits the
# "New tag:" lines it parses). A push with no pending bump publishes nothing.
#
# This file is the npm trusted-publisher entry point -- do not rename it.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # version-bump commit, tags, GitHub Releases
  pull-requests: write # the "Version Packages" PR
  id-token: write # npm provenance / trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets diffs against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # must equal the root engines.node major
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Gate (build + typecheck + tests)
        run: |
          npm run build
          npm run typecheck
          npm test

      - name: Examples smoke (headless, via oat-sim — each script asserts its own results)
        run: npm run examples

      - name: Version PR or publish (dependency order)
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true # a tag + Release per newly published package (script emits "New tag:" lines)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published versions are on the registry
        if: steps.changesets.outputs.published == 'true'
        uses: johnhenry/workflows/.github/actions/verify-published@v1
        with:
          from-workspaces: true
